management.address
endpoints.shutdown.enabled
shell.ssh.enabled
shell.ssh.port
shell.auth
security.require_ssl

# Database Configuration: Defaults to local H2 for local dev; uses Supabase PostgreSQL when environment variables are set in Render production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/saesubamdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
logging.file.name=app.log

# Web Performance & Speed Optimization (GZIP Compression & Fast Page Transfers)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=512

# HikariCP Connection Pool Warming (Fast Database Query Speed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

