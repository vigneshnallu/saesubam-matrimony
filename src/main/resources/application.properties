management.address
endpoints.shutdown.enabled
shell.ssh.enabled
shell.ssh.port
shell.auth
security.require_ssl

# Database Configuration: Defaults to local H2 for zero-config local dev; automatically uses PostgreSQL in Render production (when SPRING_DATASOURCE_URL is set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/saesubamdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
logging.file.name=app.log

# Web Performance & Speed Optimization (GZIP Compression & Fast Page Transfers)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=512

# HikariCP Connection Pool Warming (Fast Database Query Speed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Spring Mail (SMTP) Configuration for sending Real Emails to Inbox (Gmail Port 587 STARTTLS)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:vigneshn051995@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:inszhpkobjgntzbu}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
