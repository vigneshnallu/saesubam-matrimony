<!DOCTYPE html>
<html lang="ta,en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — SaeSubam Matrimony</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdf2f8 0%, #fff1f2 50%, #fef2f2 100%);
            padding: 20px;
            color: #1f2937;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(136, 19, 55, 0.15);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            border: 1px solid #fecdd3;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            background: #ffe4e6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-wrap svg {
            width: 48px;
            height: 48px;
            color: #be123c;
        }
        .badge {
            display: inline-block;
            background: #fff1f2;
            color: #9f1239;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid #fecdd3;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #881337;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .tamil-msg {
            font-size: 13px;
            color: #9f1239;
            margin-top: -12px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 16px -4px rgba(225, 29, 72, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(225, 29, 72, 0.5);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m2.829 2.828a5 5 0 012.828 6.364M3 3l18 18"></path>
            </svg>
        </div>
        <span class="badge">No Internet Connection</span>
        <h1>You are currently offline</h1>
        <p>Please check your mobile data or Wi-Fi network and try again to view profiles and continue matchmaking.</p>
        <p class="tamil-msg">இணைய இணைப்பு இல்லை. தயவுசெய்து உங்கள் இணைய இணைப்பை சரிபார்த்து மீண்டும் முயற்சிக்கவும்.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Retry Connection
        </button>
    </div>
</body>
</html>
