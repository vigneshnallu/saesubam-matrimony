<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Username & Password | SaeSubam Matrimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e11d48;
            --primary-hover: #be123c;
            --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #fff 50%, #ffe4e6 100%);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .recovery-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.08);
            border: 1px solid rgba(225, 29, 72, 0.1);
            padding: 40px 36px;
        }
        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-red);
            text-decoration: none;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: #fff1f2;
            color: var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            border: 2px dashed rgba(225, 29, 72, 0.3);
        }
        .btn-custom {
            background-color: var(--primary-red);
            color: white;
            font-weight: 700;
            border-radius: 50px;
            padding: 12px 24px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.25);
        }
        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 0.25rem rgba(225, 29, 72, 0.15);
        }
    </style>
</head>
<body>

<div class="recovery-card text-center">
    <div class="mb-3">
        <a href="/" class="brand-logo">
            <i class="bi bi-heart-fill me-1"></i> SaeSubam
        </a>
    </div>

    <div class="icon-circle">
        <i class="bi bi-key-fill"></i>
    </div>

    <h4 class="fw-bold text-dark mb-1">Forgot Username or Password?</h4>
    <p class="text-muted small mb-4">Enter your registered Email address or 10-digit Mobile number below. We will send your login credentials directly to your inbox.</p>

    <!-- Error Alert -->
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show text-start small mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}">Error details</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Success Flash Alert -->
    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show text-start small mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success details</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form action="/forgot-password" method="post" class="text-start">
        <div class="mb-4">
            <label class="form-label fw-semibold text-dark">Registered Email or Mobile Number</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted"><i class="bi bi-person-badge"></i></span>
                <input type="text" name="accountIdentifier" class="form-control border-start-0 ps-0" placeholder="e.g. priya@gmail.com or 9876543210" required autofocus>
            </div>
        </div>

        <button type="submit" class="btn btn-custom mb-3">
            <i class="bi bi-send-fill me-2"></i> Recover Account & Send Credentials
        </button>
    </form>

    <div class="mt-4 pt-3 border-top small text-muted">
        Remembered your password? <a href="/login" class="text-danger fw-bold text-decoration-none">Back to Login</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
