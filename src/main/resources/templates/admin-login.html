<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaeSubam Administration Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
        }
        .admin-badge {
            background-color: #ffe4e6;
            color: #e11d48;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .form-control {
            height: 52px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-size: 15px;
        }
        .form-control:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }
        .btn-admin-login {
            height: 52px;
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-admin-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.35);
        }
    </style>
</head>
<body>

<div class="admin-login-card text-center">
    <div class="admin-badge">
        <i class="bi bi-shield-lock-fill me-1"></i> SEPARATE ADMIN PORTAL
    </div>
    
    <h3 class="fw-bold text-dark mb-1">Administrator Sign In</h3>
    <p class="text-muted small mb-4">Dedicated Control Panel for SaeSubam Matrimony Administration</p>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 text-start small mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}">Invalid Admin credentials</span>
    </div>

    <!-- Separate Admin Login Form -->
    <form action="/admin/login" method="post" class="text-start">
        <div class="mb-3">
            <label class="form-label fw-bold text-dark small">Administrator Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter Admin Name" required autofocus>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-dark small">Administrator Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-admin-login mb-3">
            <i class="bi bi-shield-check me-2"></i> Access Admin Dashboard
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <a href="/login" class="text-secondary small text-decoration-none fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Return to Candidate User Site
        </a>
    </div>
</div>

</body>
</html>
